<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <!-- Sur téléphone et tablette : pas de zoom (automatique en touchant un
         champ, ou à deux doigts) qui ferait déborder les formulaires. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Polices chargées sans bloquer l'affichage : avec une connexion lente
         (Guinée → serveur en Europe), la page s'affiche tout de suite avec la
         police du téléphone, puis IBM Plex la remplace dès qu'elle arrive. -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap"
    />
    <link
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap"
    />
    <title>Bénef</title>
    <!-- Téléphone ou tablette : direction la version téléphone (/app/), avant
         même de charger la version ordinateur. Restent ici : la console admin,
         les pages légales, et qui ouvre une fois monbenef.com/?ordinateur. -->
    <script>
      (function () {
        try {
          var KEY = 'benef:version-ordinateur';
          if (/[?&]ordinateur\b/.test(location.search)) localStorage.setItem(KEY, '1');
          if (localStorage.getItem(KEY) === '1') return;
        } catch (e) {}
        var ua = navigator.userAgent;
        var onPhone = /Android|iPhone|iPad|iPod|Mobile/i.test(ua) ||
          (ua.indexOf('Macintosh') !== -1 && navigator.maxTouchPoints > 1);
        var path = location.pathname;
        if (!onPhone || /^\/(console|confidentialite|suppression-compte)(\/|$)/.test(path)) return;
        var same = /^\/(login|register|forgot-password)\/?$/.test(path);
        location.replace('/app' + (same ? path + location.search : '/'));
      })();
    </script>
    <!-- Pas de zoom à deux doigts : Safari (iPhone/iPad) ignore user-scalable=no,
         on bloque donc aussi ses gestes de zoom. -->
    <script>
      ['gesturestart', 'gesturechange', 'gestureend'].forEach(function (type) {
        document.addEventListener(type, function (e) { e.preventDefault(); }, { passive: false });
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
