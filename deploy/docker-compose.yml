# Production Bénef : PostgreSQL + API Django + web/HTTPS (Caddy) +
# tâches quotidiennes (taux de change, sauvegardes). Voir DEPLOIEMENT.md.
#
#   cd deploy && cp .env.example .env   # puis remplis .env
#   docker compose up -d --build

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-benef}
      POSTGRES_USER: ${DB_USER:-benef}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD manquant dans deploy/.env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-benef} -d ${DB_NAME:-benef}"]
      interval: 10s
      timeout: 5s
      retries: 10
    # Jamais exposée sur Internet : seuls les autres conteneurs y accèdent.

  backend:
    build: ../backend
    restart: unless-stopped
    env_file: .env
    environment:
      DB_ENGINE: postgres
      DB_HOST: db
      DB_PORT: "5432"
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: ${BENEF_DOMAIN}
      DJANGO_CSRF_TRUSTED_ORIGINS: https://${BENEF_DOMAIN}
      CORS_ALLOWED_ORIGINS: https://${BENEF_DOMAIN}
      # Caddy fait déjà la redirection HTTP -> HTTPS.
      DJANGO_SECURE_SSL_REDIRECT: "False"
    volumes:
      - media:/app/media
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
    restart: unless-stopped
    environment:
      BENEF_DOMAIN: ${BENEF_DOMAIN:?BENEF_DOMAIN manquant dans deploy/.env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - media:/srv/media:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend

  # Taux de change du jour + ménage des clés de rejeu, une fois par jour.
  scheduler:
    build: ../backend
    restart: unless-stopped
    env_file: .env
    environment:
      DB_ENGINE: postgres
      DB_HOST: db
      DB_PORT: "5432"
      DJANGO_DEBUG: "False"
    command: >
      sh -c 'while true; do
        python manage.py fetch_rates;
        python manage.py purge_idempotency;
        sleep 86400;
      done'
    depends_on:
      db:
        condition: service_healthy

  # Sauvegarde PostgreSQL chaque nuit, 14 jours conservés dans deploy/backups/
  # (à copier aussi hors du serveur : voir DEPLOIEMENT.md).
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGHOST: db
      PGUSER: ${DB_USER:-benef}
      PGPASSWORD: ${DB_PASSWORD}
      PGDATABASE: ${DB_NAME:-benef}
      KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./backups:/backups
      - ./backup.sh:/backup.sh:ro
    entrypoint: ["sh", "/backup.sh"]
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  media:
  caddy_data:
  caddy_config:
