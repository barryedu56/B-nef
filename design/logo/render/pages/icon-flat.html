<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@800&display=swap">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1024px;height:1024px;background:#4f46e5}
  .stage{width:1024px;height:1024px;display:flex;align-items:center;justify-content:center;position:relative}
  .glyph{width:1024px;height:1024px;position:relative;display:flex;align-items:center;justify-content:center}
  .b{position:relative;font-family:'IBM Plex Sans',sans-serif;font-weight:800;font-size:591.6444444444444px;color:#ffffff;line-height:1}
</style>
</head>
<body>
  <div class="stage">
    <div class="glyph">
      <svg width="1024" height="1024" viewBox="0 0 100 100" fill="none" style="position:absolute;inset:0;margin:auto">
         <circle cx="50" cy="50" r="38" stroke="#ffffff" stroke-opacity="0.45" stroke-width="3"/>
       </svg>
      <span class="b">B</span>
      <div style="position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:562.0622222222221px;height:88.74666666666666px;background:#ffffff;border-radius:18.991786666666663px"></div>
    </div>
  </div>
</body></html>
