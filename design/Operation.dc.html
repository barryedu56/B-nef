<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
  <style>
    *{box-sizing:border-box}
    body{margin:0;font-family:'IBM Plex Sans',system-ui,sans-serif;background:#fff;color:#1c1c1a;-webkit-font-smoothing:antialiased}
    h1,h2,h3,p{margin:0}
    a{color:#4f46e5;text-decoration:none}a:hover{color:#3730a3}
    .m{font-family:'IBM Plex Mono',ui-monospace,monospace}
  </style>
</helmet>

<div style="width:390px;min-height:900px;display:flex;flex-direction:column;background:#fff">

  <div style="display:flex;align-items:center;gap:10px;height:56px;padding:0 14px;border-bottom:1px solid #e6e6e3;flex-shrink:0">
    <span style="color:#6f6f68;display:flex"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18M6 6l12 12"/></svg></span>
    <span style="font-weight:700;font-size:17px;flex:1">Nouvelle opération</span>
  </div>

  <div style="padding:16px;display:flex;flex-direction:column;gap:16px">

    <div style="display:flex;background:#f0f0ee;border-radius:9px;padding:3px">
      <span style="flex:1;text-align:center;font-size:13.5px;padding:9px 0;color:#6f6f68">Entrée d'argent</span>
      <span style="flex:1;text-align:center;font-size:13.5px;padding:9px 0;background:#fff;border-radius:7px;font-weight:600;color:#b91c1c;box-shadow:0 1px 2px rgba(0,0,0,.06)">Sortie d'argent</span>
    </div>

    <div style="text-align:center;padding:6px 0">
      <div class="m" style="font-size:34px;font-weight:600;color:#1c1c1a">5 000 <span style="font-size:16px;color:#9a9a92">FCFA</span></div>
    </div>

    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px">
      <div style="background:#f4f4f2;border-radius:8px;padding:14px 0;text-align:center;font-size:17px;font-weight:600">1</div>
      <div style="background:#f4f4f2;border-radius:8px;padding:14px 0;text-align:center;font-size:17px;font-weight:600">2</div>
      <div style="background:#f4f4f2;border-radius:8px;padding:14px 0;text-align:center;font-size:17px;font-weight:600">3</div>
      <div style="background:#f4f4f2;border-radius:8px;padding:14px 0;text-align:center;font-size:17px;font-weight:600">4</div>
      <div style="background:#f4f4f2;border-radius:8px;padding:14px 0;text-align:center;font-size:17px;font-weight:600">5</div>
      <div style="background:#f4f4f2;border-radius:8px;padding:14px 0;text-align:center;font-size:17px;font-weight:600">6</div>
      <div style="background:#f4f4f2;border-radius:8px;padding:14px 0;text-align:center;font-size:17px;font-weight:600">7</div>
      <div style="background:#f4f4f2;border-radius:8px;padding:14px 0;text-align:center;font-size:17px;font-weight:600">8</div>
      <div style="background:#f4f4f2;border-radius:8px;padding:14px 0;text-align:center;font-size:17px;font-weight:600">9</div>
      <div style="background:#f4f4f2;border-radius:8px;padding:14px 0;text-align:center;font-size:17px;font-weight:600">000</div>
      <div style="background:#f4f4f2;border-radius:8px;padding:14px 0;text-align:center;font-size:17px;font-weight:600">0</div>
      <div style="background:#f4f4f2;border-radius:8px;padding:14px 0;text-align:center;color:#6f6f68;display:flex;align-items:center;justify-content:center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M21 4H8l-6 8 6 8h13a1 1 0 0 0 1-1V5a1 1 0 0 0-1-1zM17 9l-4 6M13 9l4 6"/></svg></div>
    </div>

    <div style="display:flex;flex-direction:column;gap:10px">
      <div style="display:flex;align-items:center;justify-content:space-between;border:1px solid #e6e6e3;border-radius:10px;padding:12px 14px">
        <span style="font-size:12px;color:#6f6f68">Catégorie</span>
        <span style="font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:6px">Transport <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#9a9a92" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></span>
      </div>
      <div style="display:flex;align-items:center;justify-content:space-between;border:1px solid #e6e6e3;border-radius:10px;padding:12px 14px">
        <span style="font-size:12px;color:#6f6f68">Activité</span>
        <span style="font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:6px">Boutique du marché <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#9a9a92" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></span>
      </div>
      <div style="border:1px solid #e6e6e3;border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:9px">
        <span style="font-size:12px;color:#6f6f68">Moyen de paiement</span>
        <div style="display:flex;flex-wrap:wrap;gap:6px">
          <span style="font-size:12.5px;background:#4f46e5;color:#fff;border-radius:999px;padding:6px 12px">Espèces</span>
          <span style="font-size:12.5px;border:1px solid #d9d9d5;border-radius:999px;padding:6px 12px">Orange Money</span>
          <span style="font-size:12.5px;border:1px solid #d9d9d5;border-radius:999px;padding:6px 12px">Wave</span>
          <span style="font-size:12.5px;border:1px solid #d9d9d5;border-radius:999px;padding:6px 12px">Banque</span>
        </div>
      </div>
      <div style="display:flex;align-items:center;justify-content:space-between;border:1px solid #e6e6e3;border-radius:10px;padding:12px 14px">
        <span style="font-size:12px;color:#6f6f68">Date</span>
        <span style="font-size:13.5px;font-weight:600">Aujourd'hui · 7 sept 2026</span>
      </div>
      <div style="border:1px dashed #c7c7c2;border-radius:10px;padding:12px 14px;font-size:13px;color:#9a9a92">Note (facultatif)</div>
    </div>

  </div>

  <div style="margin-top:auto;padding:14px 16px;border-top:1px solid #e6e6e3;flex-shrink:0">
    <button style="width:100%;padding:14px;border:none;border-radius:10px;background:#4f46e5;color:#fff;font-family:inherit;font-size:15px;font-weight:600">Enregistrer la sortie</button>
  </div>

</div>
</x-dc>
</body>
</html>
