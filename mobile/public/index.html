<!doctype html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <!-- viewport-fit=cover : l'app occupe tout l'écran de l'iPhone (encoche comprise).
         maximum-scale=1 : pas de zoom automatique en touchant un champ (sinon le
         formulaire déborde de l'écran). -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, shrink-to-fit=no, viewport-fit=cover" />
    <title>%WEB_TITLE%</title>
    <!-- Version installable (PWA), servie sous /app/ en production : sur iPhone,
         Safari → Partager → « Sur l'écran d'accueil ». -->
    <link rel="manifest" href="/app/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/app/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/app/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Bénef" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="theme-color" content="#fbf6ee" />
    <!-- Police Nunito (ronde, lisible), servie par l'app elle-même : elle
         marche aussi hors connexion. -->
    <link rel="preload" href="/app/fonts/nunito.woff2" as="font" type="font/woff2" crossorigin />
    <style>
      @font-face {
        font-family: 'Nunito';
        src: url('/app/fonts/nunito.woff2') format('woff2');
        font-weight: 200 1000;
        font-display: swap;
      }
      /* Toute l'app en Nunito. Le sélecteur #root passe devant les classes de
         react-native-web ; les icônes (police donnée dans style="…") gardent
         la leur. */
      #root,
      #root * {
        font-family: 'Nunito', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      }
    </style>
    <style id="expo-reset">
      /* Pas de zoom au double-tap ; la taille du texte ne change pas en
         tournant l'écran. */
      html {
        -webkit-text-size-adjust: 100%;
        touch-action: pan-x pan-y;
      }
      html,
      body {
        height: 100%;
        background-color: #fbf6ee;
      }
      body {
        overflow: hidden;
        /* Pas de surlignage gris au toucher ni de rebond de page, comme une vraie app. */
        -webkit-tap-highlight-color: transparent;
        overscroll-behavior: none;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
    <!-- Pas de zoom à deux doigts : Safari (iPhone/iPad) ignore user-scalable=no,
         on bloque donc aussi ses gestes de zoom. -->
    <script>
      ['gesturestart', 'gesturechange', 'gestureend'].forEach(function (type) {
        document.addEventListener(type, function (e) { e.preventDefault(); }, { passive: false });
      });
    </script>
  </head>

  <body>
    <noscript>Active JavaScript pour utiliser Bénef.</noscript>
    <div id="root"></div>
  </body>
</html>
